<script>
        // Star Rating Logic
        const stars = document.querySelectorAll('.star-btn');
        const ratingText = document.getElementById('rating-text');
        const labels = ['Needs Improvement', 'Fair', 'Good', 'Very Good', 'Excellent!'];

        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                const rating = parseInt(star.getAttribute('data-rating'));
                
                // Clear all
                stars.forEach(s => s.querySelector('.material-symbols-outlined').classList.remove('star-active'));
                
                // Set active up to rating
                for(let i = 0; i < rating; i++) {
                    stars[i].querySelector('.material-symbols-outlined').classList.add('star-active');
                }

                // Update text
                ratingText.textContent = labels[index];
                ratingText.style.opacity = '1';
                
                // Micro-interaction
                star.style.transform = 'scale(1.3)';
                setTimeout(() => star.style.transform = '', 150);
            });

            star.addEventListener('mouseenter', () => {
                const rating = parseInt(star.getAttribute('data-rating'));
                for(let i = 0; i < rating; i++) {
                    stars[i].querySelector('.material-symbols-outlined').classList.add('text-primary');
                }
            });

            star.addEventListener('mouseleave', () => {
                stars.forEach(s => {
                    if (!s.querySelector('.material-symbols-outlined').classList.contains('star-active')) {
                        s.querySelector('.material-symbols-outlined').classList.remove('text-primary');
                    }
                });
            });
        });

        // Submit Interaction
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            const btn = this;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Sending...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.classList.replace('bg-primary', 'bg-secondary');
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Submitted!';
            }, 1500);
        });
    </script>
