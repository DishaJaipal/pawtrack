<script>
        // Micro-interactions and Lightweight Atmospheric Effects
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle entrance animation for cards
            const cards = document.querySelectorAll('.soft-card-shadow');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'all 0.4s ease-out';
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 + (index * 100));
            });

            // Tap vibration simulation for buttons
            const navItems = document.querySelectorAll('nav a, button');
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    if (window.navigator.vibrate) {
                        window.navigator.vibrate(5);
                    }
                });
            });
        });
    </script>
